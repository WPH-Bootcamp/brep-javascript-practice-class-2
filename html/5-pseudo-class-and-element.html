<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 5 - Pseudo Class and Element</title>
    <link rel="stylesheet" href="../css/5-pseudo-class-and-element.css" />
  </head>
  <body>
    <h1>Materi 5 - Pseudo Class and Element</h1>

    <h2>1. Pseudo-class</h2>
    <!-- -. Hover -->
    <p>-. Hover</p>
    <div class="kotak"></div>
    <button class="kotak">Hover</button>
    <!-- -. Focus -->
    <p>-. Focus</p>
    <input type="text" />

    <h2>2. Pseudo-element</h2>
    <ul>
      <li>Tempe</li>
      <li>Tahu</li>
      <li>Lele</li>
    </ul>

    <h2>3. Gradient</h2>
    <div class="bg linear"></div>
    <div class="bg radial"></div>

    <h2>4. Object Fit</h2>
    <div class="container">
      <img src="../assets/albert.jpeg" alt="" />
    </div>
  </body>
